#!/usr/bin/env bash
# 𒀭 𝙲𝙷𝟺𝚛𝚌𝚑 𝙻𝚒𝚗𝚞𝚡 𒀭
# Build configuration for CH4rch Linux.
# Dynamically resolves the repository root for portability.
# All variables respect pre-existing environment values (for testing/overrides).

# Resolve CH4RCH_SRC to the directory two levels above this script (the repo root)
# Only set if not already defined (allows test overrides)
export CH4RCH_SRC="${CH4RCH_SRC:-$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)}"

export CH4RCH_BUILDROOT="${CH4RCH_BUILDROOT:-/var/ch4rch-build}"

export CH4RCH_WORK="${CH4RCH_WORK:-$CH4RCH_BUILDROOT/workspaces}"
export CH4RCH_ROOTFS="${CH4RCH_ROOTFS:-$CH4RCH_WORK/rootfs}"

export CH4RCH_PKGDEST="${CH4RCH_PKGDEST:-$CH4RCH_BUILDROOT/pkgdest}"
export CH4RCH_SRCDEST="${CH4RCH_SRCDEST:-$CH4RCH_BUILDROOT/srcdest}"

export CH4RCH_REPO="${CH4RCH_REPO:-$CH4RCH_BUILDROOT/repo}"

export CH4RCH_LOGS="${CH4RCH_LOGS:-$CH4RCH_BUILDROOT/logs}"
export CH4RCH_ISO="${CH4RCH_ISO:-$CH4RCH_BUILDROOT/iso}"

export CH4RCH_ARCH="${CH4RCH_ARCH:-x86_64}"
export CH4RCH_REPO_NAME="${CH4RCH_REPO_NAME:-core}"

export MAKEFLAGS="${MAKEFLAGS:--j$(nproc)}"
export PKGEXT="${PKGEXT:-.pkg.tar.zst}"