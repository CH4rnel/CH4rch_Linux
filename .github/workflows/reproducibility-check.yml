# 𒀭 𝙲𝙷𝟺𝚛𝚌𝚑 𝙻𝚒𝚗𝚞𝚡 𒀭
name: Reproducibility & Hygiene Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  hygiene-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck on host (for workflow validation)
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

            - name: Run local test suite in Arch Linux container
        run: |
          echo "Running all project tests in an Arch Linux environment..."
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed \
                bash \
                libarchive \
                git \
                make \
                shellcheck

              command -v bsdtar

              chmod +x tests/*.sh
              for test in tests/test_*.sh; do
                echo "Executing $test..."
                "$test"
              done
            '