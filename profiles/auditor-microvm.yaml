# 𒀭 𝙲𝙷𝟺𝚛𝚌𝚑 𝙻𝚒𝚗𝚞𝚡 𒀭
# MicroVM-backed Agent Profile with Remediation Capabilities.

agent:
  name: "System Auditor & Remediation Agent"
  version: "1.1.0"
  mode: "read-only-with-confirmed-remediation"

enabled: false

isolation:
  backend: microvm
  privilege: unprivileged
  network: lan-only
  filesystem:
    read_only: ["/etc", "/usr", "/var/log"]
    read_write: ["/tmp", "/var/tmp"]
  ttl: 300

capabilities:
  - id: system.audit.read
    risk: low
  - id: network.scan.local
    risk: medium
    scope: lan-only
  - id: vuln.remediate
    risk: high
    require_confirmation: true

ui:
  trigger: context-menu
  hotkey: "Super+Shift+Space"

audit:
  log_to: trust-chain