# 𒀭 𝙲𝙷𝟺𝚛𝚌𝚑 𝙻𝚒𝚗𝚞𝚡 𒀭
# Read-Only Auditor Agent Profile.
# Implements capabilities in a safe, non-remediation mode.

agent:
  name: "System Auditor (Read-Only)"
  version: "1.0.0"
  mode: "read-only"

enabled: false

isolation:
  backend: bubblewrap
  privilege: unprivileged
  network: lan-only
  filesystem:
    read_only: ["/etc", "/usr", "/var/log"]
    read_write: []
  ttl: 300

capabilities:
  - id: system.audit.read
    risk: low
  - id: network.scan.local
    risk: medium
    scope: lan-only
  - id: cache.inspect
    risk: low

ui:
  trigger: context-menu
  hotkey: "Super+Shift+A"

audit:
  log_to: trust-chain